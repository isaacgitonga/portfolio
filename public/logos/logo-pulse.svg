<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="100%" height="100%">
  <defs>
    <!-- Premium bold glow filter -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Segmented Baseline Track (gaps under active pulses) -->
  <line x1="10" y1="50" x2="40" y2="50" stroke="#9ca3af" stroke-width="1.5" stroke-opacity="0.12" />
  <line x1="60" y1="50" x2="120" y2="50" stroke="#9ca3af" stroke-width="1.5" stroke-opacity="0.12" />
  <line x1="180" y1="50" x2="190" y2="50" stroke="#9ca3af" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Bold Pulse Wave Path -->
  <path
    d="M 10 50 L 40 50 L 50 20 L 60 50 L 120 50 L 130 80 L 140 50 L 150 20 L 160 50 L 170 80 L 180 50 L 190 50"
    fill="none"
    stroke="#14b8a6"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
    filter="url(#logo-glow)"
  />

  <!-- Core Nodes -->
  <!-- Bit 0 (0): Muted -->
  <circle cx="30" cy="50" r="3.5" fill="#9ca3af" stroke="#9ca3af" stroke-width="1.5" opacity="0.45" />
  
  <!-- Bit 1 (1): Active (Top) -->
  <circle cx="50" cy="20" r="9" fill="none" stroke="#14b8a6" stroke-width="1.25" opacity="0.3" filter="url(#logo-glow)" />
  <circle cx="50" cy="20" r="4" fill="#14b8a6" opacity="0.95" />

  <!-- Bit 2 (0): Muted -->
  <circle cx="70" cy="50" r="3.5" fill="#9ca3af" stroke="#9ca3af" stroke-width="1.5" opacity="0.45" />

  <!-- Bit 3 (0): Muted -->
  <circle cx="90" cy="50" r="3.5" fill="#9ca3af" stroke="#9ca3af" stroke-width="1.5" opacity="0.45" />

  <!-- Bit 4 (0): Muted -->
  <circle cx="110" cy="50" r="3.5" fill="#9ca3af" stroke="#9ca3af" stroke-width="1.5" opacity="0.45" />

  <!-- Bit 5 (1): Active (Bottom) -->
  <circle cx="130" cy="80" r="9" fill="none" stroke="#14b8a6" stroke-width="1.25" opacity="0.3" filter="url(#logo-glow)" />
  <circle cx="130" cy="80" r="4" fill="#14b8a6" opacity="0.95" />

  <!-- Bit 6 (1): Active (Top) -->
  <circle cx="150" cy="20" r="9" fill="none" stroke="#14b8a6" stroke-width="1.25" opacity="0.3" filter="url(#logo-glow)" />
  <circle cx="150" cy="20" r="4" fill="#14b8a6" opacity="0.95" />

  <!-- Bit 7 (1): Active (Bottom) -->
  <circle cx="170" cy="80" r="9" fill="none" stroke="#14b8a6" stroke-width="1.25" opacity="0.3" filter="url(#logo-glow)" />
  <circle cx="170" cy="80" r="4" fill="#14b8a6" opacity="0.95" />
</svg>
